<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Printful Knowledge HM icon</title>
<desc id="desc">Original knowledge and print-on-demand icon with an HM creator tag.</desc>

<!-- Document card -->
<rect x="84" y="92" width="308" height="270" rx="34" fill="#FFFFFF" stroke="#0F2A43" stroke-width="18"/>

<!-- Product preview panel -->
<rect x="112" y="126" width="120" height="118" rx="20" fill="#EEF3F7"/>
<path d="M143 166 L166 148 L184 158 L201 145 L222 168 L206 184 L192 172 L192 217 Q192 228 181 228 H159 Q148 228 148 217 V172 Z"
      fill="#0F2A43"/>

<!-- Text lines -->
<rect x="259" y="147" width="92" height="18" rx="9" fill="#8EA0B3"/>
<rect x="259" y="186" width="122" height="18" rx="9" fill="#8EA0B3"/>
<rect x="259" y="225" width="104" height="18" rx="9" fill="#8EA0B3"/>

<!-- Product tag -->
<path d="M318 105 H386 L437 156 V223 L407 253 H348 L319 224 Z"
      fill="#16B7A7" stroke="#FFFFFF" stroke-width="12"/>
<circle cx="347" cy="137" r="14" fill="#FFFFFF"/>
<path d="M344 122 C318 77 288 70 265 84" fill="none" stroke="#0F2A43" stroke-width="16" stroke-linecap="round"/>

<!-- Knowledge rays -->
<g fill="#FFB21C">
  <rect x="247" y="274" width="18" height="48" rx="9"/>
  <rect x="216" y="290" width="18" height="42" rx="9" transform="rotate(-44 225 311)"/>
  <rect x="280" y="290" width="18" height="42" rx="9" transform="rotate(44 289 311)"/>
</g>

<!-- Open book -->
<path d="M65 324 Q148 304 247 349 V431 Q149 383 65 403 Z"
      fill="#1CB8A8" stroke="#FFFFFF" stroke-width="10"/>
<path d="M447 324 Q364 304 265 349 V431 Q363 383 447 403 Z"
      fill="#1CB8A8" stroke="#FFFFFF" stroke-width="10"/>
<path d="M65 366 Q150 346 247 391 V449 Q148 407 65 427 Z"
      fill="#058B84" stroke="#FFFFFF" stroke-width="10"/>
<path d="M447 366 Q362 346 265 391 V449 Q364 407 447 427 Z"
      fill="#058B84" stroke="#FFFFFF" stroke-width="10"/>

<!-- HM creator tag -->
<circle cx="405" cy="409" r="54" fill="#0F2A43" stroke="#FFFFFF" stroke-width="10"/>
<text x="405" y="424" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">HM</text>
</svg>
